<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    Fragmento <head> común a todas las páginas.
    Uso: <head th:replace="~{fragments/head :: head('Título de la página')}"></head>
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · TiendaDSS'">TiendaDSS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">

    <!--/* Necesario para el menú desplegable del navbar en pantallas pequeñas */-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
</html>
