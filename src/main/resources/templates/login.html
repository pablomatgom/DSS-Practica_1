<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar('login')}"></nav>

    <main class="container py-5">
        <div class="row">
            <div class="col-md-6 col-lg-4 mx-auto">

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle display-4 text-secondary"></i>
                            <h1 class="h3 mt-2">Iniciar sesión</h1>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            Usuario o contraseña incorrectos.
                        </div>

                        <!--/* Spring Security procesa este formulario: los campos deben llamarse username y password */-->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" id="username" name="username" class="form-control"
                                       autocomplete="username" required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" id="password" name="password" class="form-control"
                                       autocomplete="current-password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar
                            </button>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
