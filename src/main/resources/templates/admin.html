<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Administración')}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar('admin')}"></nav>

    <main class="container py-4">

        <h1 class="h2 mb-4">Panel de administración</h1>

        <div class="row g-4">

            <div class="col-md-6">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body p-4">
                        <i class="bi bi-grid-3x3-gap fs-1 text-primary"></i>
                        <h5 class="card-title mt-3">Gestionar el catálogo</h5>
                        <p class="card-text text-muted">
                            Añade, edita o elimina productos desde el catálogo.
                        </p>
                        <a th:href="@{/products}" class="btn btn-primary me-2">
                            <i class="bi bi-grid"></i> Ver catálogo
                        </a>
                        <a th:href="@{/products/add}" class="btn btn-outline-success">
                            <i class="bi bi-plus-lg"></i> Nuevo producto
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body p-4">
                        <i class="bi bi-database-down fs-1 text-success"></i>
                        <h5 class="card-title mt-3">Exportar base de datos</h5>
                        <p class="card-text text-muted">
                            Descarga un script SQL (<code>products.sql</code>) con un <code>INSERT</code> por cada producto.
                        </p>
                        <a th:href="@{/admin/export}" class="btn btn-success">
                            <i class="bi bi-download"></i> Descargar products.sql
                        </a>
                    </div>
                </div>
            </div>

        </div>

    </main>
</body>
</html>
