<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Carrito')}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar('cart')}"></nav>

    <main class="container py-4">

        <h1 class="h2 mb-4">Mi carrito</h1>

        <!--/* Avisos que llegan tras añadir o actualizar (flash attributes del controlador) */-->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}">Mensaje</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
            <span th:text="${warning}">Aviso</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <!--/* Carrito vacío */-->
        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center text-muted py-5">
            <i class="bi bi-cart-x display-3"></i>
            <p class="mt-3">Tu carrito está vacío.</p>
            <a th:href="@{/products}" class="btn btn-primary">
                <i class="bi bi-grid"></i> Ir al catálogo
            </a>
        </div>

        <!--/* Carrito con productos */-->
        <div th:unless="${#lists.isEmpty(cartItems)}">
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th class="text-end">Precio</th>
                                <th class="text-center">Cantidad</th>
                                <th class="text-end">Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td>
                                    <span th:text="${item.product.name}">Nombre del producto</span>
                                    <!--/* El stock pudo bajar después de añadirlo al carrito */-->
                                    <div th:if="${item.exceedsStock}" class="small text-danger">
                                        <i class="bi bi-exclamation-triangle"></i>
                                        <span th:text="'Solo quedan ' + ${item.product.stock} + ' unidades en stock'">Solo quedan N unidades</span>
                                    </div>
                                </td>
                                <td class="text-end"
                                    th:text="${#numbers.formatDecimal(item.product.price, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</td>
                                <td>
                                    <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post"
                                          class="m-0 d-flex justify-content-center gap-1">
                                        <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                                               th:max="${item.product.stock}" class="form-control form-control-sm"
                                               style="width: 4.5rem;" aria-label="Cantidad">
                                        <button type="submit" class="btn btn-outline-secondary btn-sm" title="Actualizar cantidad">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>
                                </td>
                                <td class="text-end"
                                    th:text="${#numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</td>
                                <td class="text-end">
                                    <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i> Quitar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-light">
                                <th colspan="3">Total</th>
                                <th class="text-end price"
                                    th:text="${#numbers.formatDecimal(#aggregates.sum(cartItems.![subtotal]), 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</th>
                                <th></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/products}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Seguir comprando
                </a>
            </div>
        </div>

    </main>
</body>
</html>
