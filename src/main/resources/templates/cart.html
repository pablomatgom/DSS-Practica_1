<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Carrito')}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar('cart')}"></nav>

    <main class="container py-4">

        <h1 class="h2 mb-4">Mi carrito</h1>

        <!--/* Carrito vacío */-->
        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center text-muted py-5">
            <i class="bi bi-cart-x display-3"></i>
            <p class="mt-3">Tu carrito está vacío.</p>
            <a th:href="@{/products}" class="btn btn-primary">
                <i class="bi bi-grid"></i> Ir al catálogo
            </a>
        </div>

        <!--/* Carrito con productos */-->
        <div th:unless="${#lists.isEmpty(cartItems)}">
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th class="text-end">Precio</th>
                                <th class="text-end"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${cartItems}">
                                <td th:text="${product.name}">Nombre del producto</td>
                                <td class="text-end"
                                    th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</td>
                                <td class="text-end">
                                    <form th:action="@{/cart/remove/{id}(id=${product.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i> Quitar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-light">
                                <th>Total</th>
                                <th class="text-end price"
                                    th:text="${#numbers.formatDecimal(#aggregates.sum(cartItems.![price]), 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</th>
                                <th></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/products}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Seguir comprando
                </a>
            </div>
        </div>

    </main>
</body>
</html>
