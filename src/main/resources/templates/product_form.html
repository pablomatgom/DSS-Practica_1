<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Producto')}"></head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar('products')}"></nav>

    <main class="container py-4">
        <div class="row">
            <div class="col-md-8 col-lg-6 mx-auto">

                <h1 class="h2 text-center mb-4"
                    th:text="${product.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <form th:action="@{/products/save}" th:object="${product}" method="post">

                            <!--/* Id oculto: vacío al añadir (INSERT), con valor al editar (UPDATE) */-->
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre del producto</label>
                                <input type="text" th:field="*{name}" class="form-control"
                                       placeholder="Ej. Taza de cerámica" required>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">Precio</label>
                                <div class="input-group">
                                    <input type="number" th:field="*{price}" step="0.01" min="0"
                                           class="form-control" placeholder="0.00" required>
                                    <span class="input-group-text">€</span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="stock" class="form-label">Stock disponible</label>
                                <input type="number" th:field="*{stock}" step="1" min="0"
                                       class="form-control" placeholder="0" required>
                                <div class="form-text">Unidades que quedan para la venta.</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/products}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> Guardar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
