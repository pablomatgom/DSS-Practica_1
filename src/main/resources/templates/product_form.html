<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light mb-4">
        <a class="navbar-brand" href="/">
            <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="Inicio" width="30" height="30">
        </a>

        <a th:href="@{/products}" class="btn btn-secondary">Volver al Catálogo</a>
    </nav>

    <h1 class="text-center my-5"
        th:text="${product.id == null} ? 'Nuevo Producto' : 'Editar Producto'">Producto</h1>

    <div class="row">
        <div class="col-md-6 mx-auto">

            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Datos del Producto</h5>
                </div>

                <div class="card-body">
                    
                    <form th:action="@{/products/save}" th:object="${product}" method="post">

                        <!-- Id oculto: vacío al añadir (INSERT), con valor al editar (UPDATE) -->
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Nombre del Producto
                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">
                                Precio
                            </label>

                            <input type="number"
                                   th:field="*{price}"
                                   step="0.01"
                                   min="0"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/products}"
                               class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
